name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: every job only needs to read repository
# contents (checkout + install + test). No job writes to the repo,
# publishes a package, or needs any other GITHUB_TOKEN permission.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR so only the latest push is
# ever actually built and tested.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend test suite
        # --disable-socket fails any test that attempts a real network or
        # provider call; --allow-unix-socket permits only the local-loopback
        # unix sockets FastAPI's TestClient uses internally (never a real
        # network call). No API key is set anywhere in this job -- every
        # OpenAI-touching test uses a fake client (see test_openai_reviewer.py
        # / test_openai_candidate_generator.py) and never needs one.
        run: python -m pytest --disable-socket --allow-unix-socket

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
